name: Build, test and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (leave blank for checks only)
        required: false
        type: string
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python3 scripts/version.py "$RELEASE_TAG"
      - name: Test Homebrew cask publishing
        # Older tags rebuilt via workflow_dispatch predate the tap publisher.
        if: hashFiles('scripts/test_homebrew_cask.py') != ''
        run: python3 scripts/test_homebrew_cask.py
  build:
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-24.04
            target: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Read toolchain pins from the checked-out ref
        id: toolchains
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          rust_pin = Path('rust-toolchain.toml')
          zig_pin = Path('.config/mise.toml')
          # Tags created before the toolchain files used these versions.
          rust = tomllib.loads(rust_pin.read_text())['toolchain']['channel'] if rust_pin.exists() else '1.98.1'
          zig = tomllib.loads(zig_pin.read_text())['tools']['zig'] if zig_pin.exists() else '0.16.0'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'rust={rust}', f'zig={zig}', sep='\n', file=output)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchains.outputs.rust }}
          components: rustfmt, clippy
      - name: Select Xcode SDK for Ghostty
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ steps.toolchains.outputs.zig }}
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: bash scripts/linux-dependencies.sh
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-on-failure: true
      - run: python scripts/test_package.py
      - run: python scripts/bundle-neovim.py --target ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: python scripts/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: zvim-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
      prerelease: ${{ steps.publish.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: zvim-macos-*
          path: release
          merge-multiple: true
      - name: Version archives and generate checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          folder = pathlib.Path('release')
          files = sorted(folder.iterdir())
          expected = {'zvim-macos-arm64.zip'}
          assert {p.name for p in files} == expected, 'Missing or unexpected release archives'
          checksums = []
          for file in files:
              dest = file.with_name(file.name.replace('zvim-', 'zvim-' + os.environ['RELEASE_TAG'] + '-', 1))
              file.rename(dest)
              checksums.append(hashlib.sha256(dest.read_bytes()).hexdigest() + '  ' + dest.name)
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n')
          PY
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          extra=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then extra+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Zvim $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${extra[@]}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" >> "$GITHUB_OUTPUT"

  homebrew:
    if: github.repository == 'z0mbix/zvim' && needs.release.outputs.prerelease == 'false'
    needs: release
    uses: ./.github/workflows/homebrew.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
