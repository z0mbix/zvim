name: Publish Homebrew cask

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_SSH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing latest stable release to publish to the tap
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-zvim
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'z0mbix/zvim'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate published stable release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName > release.json
          latest=$(gh release view --json tagName --jq .tagName)
          python3 scripts/homebrew_cask.py validate "$RELEASE_TAG" release.json "$latest"
      - name: Download published macOS archive and checksums
        run: |
          gh release download "$RELEASE_TAG" --dir release \
            --pattern "zvim-$RELEASE_TAG-macos-arm64.zip" --pattern SHA256SUMS.txt
      - name: Check out the tap with its dedicated deploy key
        uses: actions/checkout@v4
        with:
          repository: z0mbix/homebrew-tap
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      - name: Verify archive and generate cask
        run: python3 scripts/homebrew_cask.py generate "$RELEASE_TAG" release homebrew-tap/Casks/zvim.rb
      - name: Check cask syntax
        run: ruby -c homebrew-tap/Casks/zvim.rb
      - name: Commit and publish cask
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git add Casks/zvim.rb
          if git diff --cached --quiet; then
            echo "The tap already contains Zvim $RELEASE_TAG"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "zvim $RELEASE_TAG"
          git pull --rebase origin main
          latest=$(gh release view --json tagName --jq .tagName)
          if [[ "$RELEASE_TAG" != "$latest" ]]; then
            echo "Refusing to publish an older Zvim release; latest stable release is $latest" >&2
            exit 1
          fi
          git push origin HEAD:main
